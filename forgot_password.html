<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forgot Password - Pitstop</title>
<link rel="stylesheet" href="user.css" />
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<style>
    .method-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .method-btn {
        flex: 1;
        padding: 12px;
        border: 2px solid var(--muted);
        background: transparent;
        color: var(--muted);
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
    }
    
    .method-btn:hover {
        border-color: var(--text);
        color: var(--text);
    }
    
    .method-btn.active {
        background: var(--text);
        border-color: var(--text);
        color: white;
    }
    
    .step {
        display: none;
    }
    
    .step.active {
        display: block;
        animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .verification-code {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
    }
    
    .verification-code input {
        width: 50px;
        height: 50px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        border: 2px solid var(--muted);
        border-radius: 8px;
        background: rgba(255,255,255,0.1);
        color: white;
    }
    
    .verification-code input:focus {
        border-color: var(--text);
        outline: none;
    }
    
    .success-message {
        background: rgba(76, 175, 80, 0.2);
        border: 1px solid #4caf50;
        color: #4caf50;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
    }
    
    .info-message {
        background: rgba(33, 150, 243, 0.2);
        border: 1px solid #2196f3;
        color: #2196f3;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 14px;
    }
    
    .resend-link {
        text-align: center;
        margin-top: 15px;
        color: var(--muted);
        font-size: 14px;
    }
    
    .resend-link button {
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        text-decoration: underline;
        font-size: 14px;
    }
    
    .back-to-login {
        text-align: center;
        margin-top: 20px;
    }
    
    .back-to-login a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
<header class="topbar">
    <div class="logo">Pitstop</div>
    <nav>
        <a href="user_login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>

<main class="intro-section">
    <div class="login-container">
        <h2>Forgot Password</h2>
        
        <!-- Step 1: Choose Method -->
        <div id="step1" class="step active">
            <p style="text-align:center; color:var(--muted); margin-bottom:20px;">
                Choose how you want to receive your verification code
            </p>
            
            <div class="method-selector">
                <button type="button" class="method-btn active" id="emailMethodBtn">
                    <i class="fas fa-envelope"></i><br>Email
                </button>
                <button type="button" class="method-btn" id="smsMethodBtn">
                    <i class="fas fa-sms"></i><br>SMS
                </button>
            </div>
            
            <form id="requestCodeForm">
                <div class="input-group" id="emailInputGroup">
                    <label for="emailInput"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="emailInput" placeholder="Enter your registered email" required>
                </div>
                
                <div class="input-group" id="phoneInputGroup" style="display:none;">
                    <label for="phoneInput"><i class="fas fa-phone"></i> Contact Number</label>
                    <input type="tel" id="phoneInput" placeholder="09xxxxxxxxx" maxlength="11">
                </div>
                
                <button type="submit" class="login-btn">Send Verification Code</button>
            </form>
            
            <div class="back-to-login">
                <a href="user_login.html">← Back to Login</a>
            </div>
        </div>
        
        <!-- Step 2: Verify Code -->
        <div id="step2" class="step">
            <div class="info-message">
                We've sent a 6-digit verification code to <strong id="sentTo"></strong>
            </div>
            
            <form id="verifyCodeForm">
                <div class="verification-code">
                    <input type="text" maxlength="1" class="code-input" data-index="0">
                    <input type="text" maxlength="1" class="code-input" data-index="1">
                    <input type="text" maxlength="1" class="code-input" data-index="2">
                    <input type="text" maxlength="1" class="code-input" data-index="3">
                    <input type="text" maxlength="1" class="code-input" data-index="4">
                    <input type="text" maxlength="1" class="code-input" data-index="5">
                </div>
                
                <button type="submit" class="login-btn">Verify Code</button>
            </form>
            
            <div class="resend-link">
                Didn't receive the code? 
                <button id="resendBtn" type="button">Resend Code</button>
            </div>
        </div>
        
        <!-- Step 3: Reset Password -->
        <div id="step3" class="step">
            <div class="success-message">
                ✓ Code verified successfully! Set your new password.
            </div>
            
            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
                
                <div class="input-group">
                    <label for="confirmNewPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required>
                </div>
                
                <button type="submit" class="login-btn">Reset Password</button>
            </form>
        </div>
    </div>
</main>

<script>
let selectedMethod = 'email';
let verificationCode = '';
let userEmail = '';
let userPhone = '';
let userToReset = null;

// Method selection
document.getElementById('emailMethodBtn').addEventListener('click', function() {
    selectedMethod = 'email';
    document.getElementById('emailMethodBtn').classList.add('active');
    document.getElementById('smsMethodBtn').classList.remove('active');
    document.getElementById('emailInputGroup').style.display = 'block';
    document.getElementById('phoneInputGroup').style.display = 'none';
    document.getElementById('emailInput').required = true;
    document.getElementById('phoneInput').required = false;
});

document.getElementById('smsMethodBtn').addEventListener('click', function() {
    selectedMethod = 'sms';
    document.getElementById('smsMethodBtn').classList.add('active');
    document.getElementById('emailMethodBtn').classList.remove('active');
    document.getElementById('phoneInputGroup').style.display = 'block';
    document.getElementById('emailInputGroup').style.display = 'none';
    document.getElementById('phoneInput').required = true;
    document.getElementById('emailInput').required = false;
});

// Allow only numbers in phone input
document.getElementById('phoneInput').addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
});

// Step 1: Request Code
document.getElementById('requestCodeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const emailInput = document.getElementById('emailInput').value.trim();
    const phoneInput = document.getElementById('phoneInput').value.trim();
    
    // Get users from localStorage
    const users = JSON.parse(localStorage.getItem('users') || '[]');
    
    let user = null;
    
    if(selectedMethod === 'email') {
        if(!emailInput) {
            alert('Please enter your email address');
            return;
        }
        user = users.find(u => u.email === emailInput);
        userEmail = emailInput;
    } else {
        if(!phoneInput) {
            alert('Please enter your contact number');
            return;
        }
        if(phoneInput.length !== 11) {
            alert('Contact number must be 11 digits');
            return;
        }
        user = users.find(u => u.contact === phoneInput);
        userPhone = phoneInput;
    }
    
    if(!user) {
        alert(`No account found with this ${selectedMethod === 'email' ? 'email' : 'contact number'}`);
        return;
    }
    
    userToReset = user;
    
    // Generate 6-digit code
    verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    // Send verification code
    if(selectedMethod === 'email') {
        await sendEmailCode(user.email, verificationCode, user.fullname);
    } else {
        await sendSMSCode(user.contact, verificationCode, user.fullname);
    }
});

async function sendEmailCode(email, code, fullname) {
    try {
        const response = await fetch('http://localhost/ordering/send_verification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                method: 'email',
                to: email,
                code: code,
                fullname: fullname
            })
        });
        
        const result = await response.json();
        
        if(result.status === 'ok') {
            document.getElementById('sentTo').textContent = email;
            showStep(2);
            alert('Verification code sent to your email!');
        } else {
            alert('Failed to send email: ' + result.error);
        }
    } catch(err) {
        console.error('Email error:', err);
        // For demo purposes, show code in alert
        alert(`Demo Mode: Your verification code is ${code}\n(Email service not configured)`);
        document.getElementById('sentTo').textContent = email;
        showStep(2);
    }
}

async function sendSMSCode(phone, code, fullname) {
    try {
        const response = await fetch('http://localhost/ordering/send_verification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                method: 'sms',
                to: phone,
                code: code,
                fullname: fullname
            })
        });
        
        const result = await response.json();
        
        if(result.status === 'ok') {
            document.getElementById('sentTo').textContent = phone;
            showStep(2);
            alert('Verification code sent to your phone!');
        } else {
            alert('Failed to send SMS: ' + result.error);
        }
    } catch(err) {
        console.error('SMS error:', err);
        // For demo purposes, show code in alert
        alert(`Demo Mode: Your verification code is ${code}\n(SMS service not configured)`);
        document.getElementById('sentTo').textContent = phone;
        showStep(2);
    }
}

// Step 2: Verify Code
const codeInputs = document.querySelectorAll('.code-input');

codeInputs.forEach((input, index) => {
    input.addEventListener('input', function() {
        // Only allow numbers
        this.value = this.value.replace(/[^0-9]/g, '');
        
        // Move to next input
        if(this.value && index < codeInputs.length - 1) {
            codeInputs[index + 1].focus();
        }
    });
    
    input.addEventListener('keydown', function(e) {
        // Move to previous input on backspace
        if(e.key === 'Backspace' && !this.value && index > 0) {
            codeInputs[index - 1].focus();
        }
    });
});

document.getElementById('verifyCodeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const enteredCode = Array.from(codeInputs).map(input => input.value).join('');
    
    if(enteredCode.length !== 6) {
        alert('Please enter the complete 6-digit code');
        return;
    }
    
    if(enteredCode === verificationCode) {
        showStep(3);
    } else {
        alert('Invalid verification code. Please try again.');
        codeInputs.forEach(input => input.value = '');
        codeInputs[0].focus();
    }
});

// Resend Code
document.getElementById('resendBtn').addEventListener('click', function() {
    verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    if(selectedMethod === 'email') {
        sendEmailCode(userEmail, verificationCode, userToReset.fullname);
    } else {
        sendSMSCode(userPhone, verificationCode, userToReset.fullname);
    }
});

// Step 3: Reset Password
document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value.trim();
    const confirmPassword = document.getElementById('confirmNewPassword').value.trim();
    
    if(!newPassword || !confirmPassword) {
        alert('Please fill in all fields');
        return;
    }
    
    // Password validation
    const strongPass = /^(?=.*[A-Z]|.*\d|.*[!@#$%^&*]).{8,}$/;
    if(!strongPass.test(newPassword)) {
        alert('Password must be 8+ characters and contain at least one: uppercase, number, or special character.');
        return;
    }
    
    if(newPassword !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }
    
    // Update password in localStorage
    try {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const userIndex = users.findIndex(u => u.email === userToReset.email);
        
        if(userIndex !== -1) {
            users[userIndex].password = newPassword;
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('Password reset successfully! You can now login with your new password.');
            window.location.href = 'user_login.html';
        } else {
            alert('Error: User not found');
        }
    } catch(err) {
        console.error('Error updating password:', err);
        alert('Error resetting password. Please try again.');
    }
});

function showStep(stepNumber) {
    document.querySelectorAll('.step').forEach(step => {
        step.classList.remove('active');
    });
    document.getElementById(`step${stepNumber}`).classList.add('active');
    
    if(stepNumber === 2) {
        codeInputs[0].focus();
    }
}
</script>
</body>
</html>
